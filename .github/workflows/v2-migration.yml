name: Release

# Official SayIt release pipeline (the proven v2 build/sign/notarize flow).
# Triggered only by version tags; workflow_dispatch remains for manual re-runs.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: compile only (heavy). Cache MLX/SwiftPM/Xcode intermediates + save.
  # ---------------------------------------------------------------------------
  build:
    name: Build arm64 App
    runs-on: macos-26
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      tag: ${{ steps.release_metadata.outputs.tag }}
      cache-hit-compilation: ${{ steps.compilation_cache.outputs.cache-hit }}
      cache-hit-spm: ${{ steps.spm_cache.outputs.cache-hit }}
      cache-hit-sherpa: ${{ steps.sherpa_runtime.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          VERSION="$(awk -F' = ' '/^[[:space:]]*MARKETING_VERSION = / { value=$2; sub(/;.*/, "", value); print value; exit }' Voxt.xcodeproj/project.pbxproj)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid MARKETING_VERSION: ${VERSION:-<missing>}"
            exit 1
          fi
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION (expected $TAG)"
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve cache keys
        id: cache_key
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/-+$//')"
          SHERPA_SCRIPT_HASH="$(shasum -a 256 tools/build_sherpa_onnx_macos.sh | awk '{print $1}')"
          PACKAGE_HASH="$(shasum -a 256 Voxt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | awk '{print $1}')"
          # Bump cache version suffix when cache layout changes (v2 adds SourcePackages + ModuleCache).
          COMPILE_PREFIX="xcode-compile-${RUNNER_OS}-${RUNNER_ARCH}-${XCODE_VERSION}-release-arm64-v2"
          SPM_PREFIX="spm-source-${RUNNER_OS}-${RUNNER_ARCH}-${XCODE_VERSION}-v2"
          echo "xcode_version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_hash=$PACKAGE_HASH" >> "$GITHUB_OUTPUT"
          echo "sherpa_key=sherpa-onnx-${RUNNER_OS}-${RUNNER_ARCH}-${XCODE_VERSION}-142807252687d81b40d6315f23470a1512a00de3-${SHERPA_SCRIPT_HASH}" >> "$GITHUB_OUTPUT"
          echo "compilation_key=${COMPILE_PREFIX}-${PACKAGE_HASH}" >> "$GITHUB_OUTPUT"
          echo "compilation_restore_prefix=${COMPILE_PREFIX}-" >> "$GITHUB_OUTPUT"
          echo "spm_key=${SPM_PREFIX}-${PACKAGE_HASH}" >> "$GITHUB_OUTPUT"
          echo "spm_restore_prefix=${SPM_PREFIX}-" >> "$GITHUB_OUTPUT"

      - name: Prepare Sherpa ONNX runtime
        id: sherpa_runtime
        uses: actions/cache/restore@v5
        with:
          path: |
            ThirdParty/sherpa-onnx/install
            ThirdParty/sherpa-onnx/sherpa-onnx.xcframework
          key: ${{ steps.cache_key.outputs.sherpa_key }}

      - name: Build Sherpa ONNX runtime on cache miss
        if: steps.sherpa_runtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tools/build_sherpa_onnx_macos.sh

      - name: Configure Sherpa ONNX runtime
        run: |
          set -euo pipefail
          cp Config/SherpaOnnx.local.xcconfig.example Config/SherpaOnnx.local.xcconfig

      - name: Restore SwiftPM SourcePackages cache (MLX / llama / etc.)
        id: spm_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/DerivedData/SourcePackages
            build/DerivedData/ModuleCache.noindex
          key: ${{ steps.cache_key.outputs.spm_key }}
          restore-keys: |
            ${{ steps.cache_key.outputs.spm_restore_prefix }}

      - name: Restore Xcode compilation cache
        id: compilation_cache
        uses: actions/cache/restore@v5
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache_key.outputs.compilation_key }}
          restore-keys: |
            ${{ steps.cache_key.outputs.compilation_restore_prefix }}

      - name: Report cache status
        run: |
          {
            echo "### Build caches"
            echo "- Sherpa ONNX: ${{ steps.sherpa_runtime.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
            echo "- SwiftPM/ModuleCache: ${{ steps.spm_cache.outputs.cache-hit == 'true' && 'exact hit' || 'miss/partial' }}"
            echo "- Xcode CompilationCache: ${{ steps.compilation_cache.outputs.cache-hit == 'true' && 'exact hit' || 'miss/partial' }}"
            echo "- Package.resolved: \`${{ steps.cache_key.outputs.package_hash }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build arm64 release app
        run: |
          set -euo pipefail
          mkdir -p build/DerivedData
          xcodebuild \
            -project Voxt.xcodeproj \
            -scheme Voxt \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -showBuildTimingSummary \
            build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d build/DerivedData/Build/Products/Release/SayIt.app
          test -f build/DerivedData/Build/Products/Release/SayIt.app/Contents/MacOS/SayIt
          lipo -info build/DerivedData/Build/Products/Release/SayIt.app/Contents/MacOS/SayIt | tee build/arch-info.txt
          grep -E 'arm64|aarch64' build/arch-info.txt > /dev/null
          if grep -E 'x86_64' build/arch-info.txt; then
            echo "::error::Expected arm64-only binary, found x86_64"
            exit 1
          fi

      - name: Package unsigned app for signing job
        run: |
          set -euo pipefail
          mkdir -p build/unsigned
          # Tar preserves framework symlinks (Sparkle Versions/Current). Plain
          # artifact upload of .app trees can make Sparkle "bundle format ambiguous".
          tar -C build/DerivedData/Build/Products/Release -czf build/unsigned/SayIt.app.tar.gz SayIt.app
          cp build/arch-info.txt build/unsigned/arch-info.txt
          du -sh build/unsigned/SayIt.app.tar.gz
          du -sh build/DerivedData/SourcePackages 2>/dev/null || true
          du -sh build/DerivedData/CompilationCache.noindex 2>/dev/null || true
          du -sh build/DerivedData/ModuleCache.noindex 2>/dev/null || true

      - name: Save SwiftPM SourcePackages + ModuleCache
        if: steps.spm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/DerivedData/SourcePackages
            build/DerivedData/ModuleCache.noindex
          key: ${{ steps.cache_key.outputs.spm_key }}

      - name: Save Xcode compilation cache
        if: steps.compilation_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.cache_key.outputs.compilation_key }}

      - uses: actions/upload-artifact@v4
        with:
          name: sayit-v2-unsigned-app-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build/unsigned/SayIt.app.tar.gz
            build/unsigned/arch-info.txt

  # ---------------------------------------------------------------------------
  # Job 2: sign + notarize only (reuses compiled app; no MLX rebuild).
  # ---------------------------------------------------------------------------
  sign-notarize:
    name: Sign, Notarize, Package
    runs-on: macos-26
    needs: build
    outputs:
      version: ${{ needs.build.outputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      release_build_number: ${{ steps.sparkle_meta.outputs.release_build_number }}
      sparkle_signed: ${{ steps.sparkle_sign.outputs.sparkle_signed }}
    env:
      DEVELOPER_ID_APP_IDENTITY: "Developer ID Application: yee wang (6W97S9B7CZ)"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sayit-v2-unsigned-app-${{ github.sha }}
          path: build/unsigned

      - name: Extract unsigned app (preserve framework symlinks)
        run: |
          set -euo pipefail
          test -f build/unsigned/SayIt.app.tar.gz
          tar -xzf build/unsigned/SayIt.app.tar.gz -C build/unsigned
          test -d build/unsigned/SayIt.app
          test -f build/unsigned/SayIt.app/Contents/MacOS/SayIt
          # Sparkle must keep Versions/Current symlink structure.
          test -L build/unsigned/SayIt.app/Contents/Frameworks/Sparkle.framework/Versions/Current \
            || test -d build/unsigned/SayIt.app/Contents/Frameworks/Sparkle.framework/Versions/B
          ls -la build/unsigned/SayIt.app/Contents/Frameworks/Sparkle.framework || true
          ls -la build/unsigned/SayIt.app/Contents/MacOS

      - name: Validate SayIt signing secrets
        run: |
          set -euo pipefail
          for key in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64 \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing SayIt GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install Developer ID certificate
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/sayit-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/v2-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$DEVELOPER_ID_APP_IDENTITY" > /dev/null

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Sign the app with SayIt Developer ID
        run: |
          set -euo pipefail
          APP_PATH="build/unsigned/SayIt.app"
          ENTITLEMENTS_PATH="Voxt/Voxt.DeveloperID.entitlements"
          BUNDLE_ID="com.sayit.app"
          test -d "$APP_PATH"
          test -f "$ENTITLEMENTS_PATH"
          test -f "$APP_PATH/Contents/MacOS/SayIt"
          ls -la "$APP_PATH/Contents/MacOS"
          # Fail only on real entitlement keys, not comments.
          if grep -E '<key>com\.apple\.security\.app-sandbox</key>|<key>com\.apple\.application-identifier</key>|<key>keychain-access-groups</key>|<key>com\.apple\.developer\.icloud' "$ENTITLEMENTS_PATH"; then
            echo "::error::Developer ID entitlements must stay unsandboxed and free of restricted identity keys"
            exit 1
          fi
          sign_target() {
            local target="$1"
            if [ -e "$target" ]; then
              codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APP_IDENTITY" "$target"
            fi
          }
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          test -d "$SPARKLE_FRAMEWORK"
          sign_target "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Installer.xpc"
          sign_target "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/InstallerLauncher.xpc"
          sign_target "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"
          sign_target "$SPARKLE_FRAMEWORK/Versions/B/Autoupdate"
          sign_target "$SPARKLE_FRAMEWORK/Versions/B/Updater.app"
          sign_target "$SPARKLE_FRAMEWORK"
          while IFS= read -r -d '' target; do
            sign_target "$target"
          done < <(find "$APP_PATH/Contents/Frameworks" -mindepth 1 -maxdepth 1 \
            \( \( -type d -name '*.framework' \) -o \( -type f -name '*.dylib' \) \) \
            ! -path "$SPARKLE_FRAMEWORK" -print0)
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$DEVELOPER_ID_APP_IDENTITY" \
            "$APP_PATH"
          codesign --verify --strict --verbose=4 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | tee build/codesign.txt
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | tee build/entitlements.xml
          if grep -E 'app-sandbox|application-identifier|keychain-access-groups|icloud' build/entitlements.xml; then
            echo "::error::Signed app still contains restricted or sandbox entitlements"
            cat build/entitlements.xml
            exit 1
          fi
          grep -F "TeamIdentifier=6W97S9B7CZ" build/codesign.txt > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist" | grep -Fx "$BUNDLE_ID"

      - name: Notarize and staple
        run: |
          set -euo pipefail
          APP_PATH="build/unsigned/SayIt.app"
          VERSION="${{ needs.build.outputs.version }}"
          ZIP_PATH="build/SayIt-${VERSION}-macOS.zip"
          mkdir -p build
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Resolve Sparkle version metadata
        id: sparkle_meta
        run: |
          set -euo pipefail
          APP_PATH="build/unsigned/SayIt.app"
          VERSION="${{ needs.build.outputs.version }}"
          BUILD_NUMBER="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist" 2>/dev/null || true
          )"
          if ! [[ "${BUILD_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              BUILD_NUMBER=$((BASH_REMATCH[1] * 100000000 + BASH_REMATCH[2] * 100000 + BASH_REMATCH[3] * 100 + 99))
            else
              echo "::error::Unable to resolve Sparkle build number for version $VERSION"
              exit 1
            fi
          fi
          echo "release_build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Sparkle sparkle:version=$BUILD_NUMBER shortVersion=$VERSION"

      - name: Build Tauri migration payload
        run: |
          set -euo pipefail
          APP_PATH="build/unsigned/SayIt.app"
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          PAYLOAD_NAME="SayIt-${VERSION}-aarch64.app.tar.gz"
          PAYLOAD_PATH="build/${PAYLOAD_NAME}"
          KEY_PATH="$RUNNER_TEMP/sayit-tauri.key"
          STAGING_PATH="$RUNNER_TEMP/sayit-migration"
          rm -rf "$STAGING_PATH"
          mkdir -p "$STAGING_PATH"
          cp -R "$APP_PATH" "$STAGING_PATH/SayIt.app"
          tar -czf "$PAYLOAD_PATH" -C "$STAGING_PATH" SayIt.app
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          env -u TAURI_SIGNING_PRIVATE_KEY npx --yes @tauri-apps/cli@2.10.0 signer sign \
            --private-key-path "$KEY_PATH" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$PAYLOAD_PATH"
          test -s "$PAYLOAD_PATH.sig"
          shasum -a 256 "$PAYLOAD_PATH" > "$PAYLOAD_PATH.sha256"
          # Tauri expects the raw minisign signature text from the .sig file.
          SIGNATURE="$(tr -d '\n' < "$PAYLOAD_PATH.sig")"
          PAYLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PAYLOAD_NAME}"
          UPDATE_ENDPOINT="https://sayit-update.vercel.app/latest.json"
          jq -n \
            --arg version "$VERSION" \
            --arg signature "$SIGNATURE" \
            --arg url "$PAYLOAD_URL" \
            --arg endpoint "$UPDATE_ENDPOINT" \
            '{
              version: $version,
              notes: "SayIt has migrated to Voxt.",
              pub_date: (now | todate),
              platforms: {
                "darwin-aarch64": { signature: $signature, url: $url },
                "darwin-aarch64-app": { signature: $signature, url: $url }
              },
              endpoint: $endpoint
            }' > build/latest.json
          if [ -f build/unsigned/arch-info.txt ]; then
            cp build/unsigned/arch-info.txt build/arch-info.txt
          else
            lipo -info "$APP_PATH/Contents/MacOS/SayIt" | tee build/arch-info.txt
          fi

      - name: Generate Sparkle edSignature for macOS zip
        id: sparkle_sign
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          ZIP_PATH="build/SayIt-${VERSION}-macOS.zip"
          SIG_ENV_FILE="build/sparkle-signature.env"
          KEY_FILE="$RUNNER_TEMP/sparkle-private-key.pem"
          test -f "$ZIP_PATH"

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "sparkle_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_PRIVATE_KEY is missing; EdgeOne appcast will publish without edSignature."
            {
              echo "SPARKLE_ED_SIGNATURE="
              echo "SPARKLE_ED_LENGTH=$(stat -f%z "$ZIP_PATH")"
            } > "$SIG_ENV_FILE"
            exit 0
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Prefer Sparkle tooling from the app bundle SourcePackages if present;
          # fall back to resolving via xcodebuild package cache in DerivedData.
          SIGN_UPDATE_BIN="$(
            find "$HOME/Library/Developer/Xcode/DerivedData" \
              -path '*/Sparkle/bin/sign_update' -type f 2>/dev/null | head -n 1 || true
          )"
          if [ -z "$SIGN_UPDATE_BIN" ]; then
            # Last resort: use swift package plugin binary if checkout exists under workspace.
            SIGN_UPDATE_BIN="$(find . -path '*/Sparkle/bin/sign_update' -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SIGN_UPDATE_BIN" ]; then
            echo "sparkle_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unable to locate Sparkle sign_update; publishing length only."
            {
              echo "SPARKLE_ED_SIGNATURE="
              echo "SPARKLE_ED_LENGTH=$(stat -f%z "$ZIP_PATH")"
            } > "$SIG_ENV_FILE"
            rm -f "$KEY_FILE"
            exit 0
          fi

          SIGN_OUTPUT="$("$SIGN_UPDATE_BIN" "$ZIP_PATH" --ed-key-file "$KEY_FILE" 2>/tmp/sign_update.err || true)"
          if [ -z "$SIGN_OUTPUT" ]; then
            SIGN_OUTPUT="$("$SIGN_UPDATE_BIN" "$ZIP_PATH" "$KEY_FILE" 2>>/tmp/sign_update.err || true)"
          fi
          SPARKLE_ED_SIGNATURE="$(printf '%s\n' "$SIGN_OUTPUT" | grep -Eo 'sparkle:edSignature="[^"]+"' | head -n 1 | sed -E 's/^[^"]*"([^"]+)".*$/\1/' || true)"
          SPARKLE_ED_LENGTH="$(printf '%s\n' "$SIGN_OUTPUT" | grep -Eo 'length="[0-9]+"' | head -n 1 | sed -E 's/^[^"]*"([0-9]+)".*$/\1/' || true)"
          if [ -z "${SPARKLE_ED_LENGTH:-}" ]; then
            SPARKLE_ED_LENGTH="$(stat -f%z "$ZIP_PATH")"
          fi

          if [ -z "${SPARKLE_ED_SIGNATURE:-}" ]; then
            echo "sparkle_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to parse sparkle:edSignature; publishing length only."
            cat /tmp/sign_update.err || true
            {
              echo "SPARKLE_ED_SIGNATURE="
              echo "SPARKLE_ED_LENGTH=$SPARKLE_ED_LENGTH"
            } > "$SIG_ENV_FILE"
          else
            echo "sparkle_signed=true" >> "$GITHUB_OUTPUT"
            {
              echo "SPARKLE_ED_SIGNATURE=$SPARKLE_ED_SIGNATURE"
              echo "SPARKLE_ED_LENGTH=$SPARKLE_ED_LENGTH"
            } > "$SIG_ENV_FILE"
            echo "Sparkle signature generated length=$SPARKLE_ED_LENGTH"
          fi
          rm -f "$KEY_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: sayit-v2-signed-migration-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/SayIt-*-macOS.zip
            build/SayIt-*-aarch64.app.tar.gz
            build/SayIt-*-aarch64.app.tar.gz.sig
            build/SayIt-*-aarch64.app.tar.gz.sha256
            build/latest.json
            build/sparkle-signature.env
            build/codesign.txt
            build/arch-info.txt

  # ---------------------------------------------------------------------------
  # Job 3: publish release + updater feeds (Vercel Tauri + EdgeOne Sparkle).
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release + Updater Feeds
    runs-on: ubuntu-latest
    needs: sign-notarize
    permissions:
      contents: write
    env:
      TAG: ${{ needs.sign-notarize.outputs.tag }}
      VERSION: ${{ needs.sign-notarize.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.sign-notarize.outputs.release_build_number }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      # GitHub-connected EdgeOne project makers-2gtkiwcbcdiw (custom domain sayit-update.xiaobe.top)
      EDGEONE_PROJECT_NAME: sayit-sparkle-update
      EDGEONE_PUBLIC_FEED_BASE: https://sayit-update.xiaobe.top
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sayit-v2-signed-migration-${{ github.sha }}
          path: build

      - name: Create release and publish updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP_PATH="build/SayIt-${VERSION}-macOS.zip"
          PAYLOAD_PATH="build/SayIt-${VERSION}-aarch64.app.tar.gz"
          test -f "$ZIP_PATH"
          test -f "$PAYLOAD_PATH"
          test -f "$PAYLOAD_PATH.sig"
          test -f build/latest.json
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_PATH" "$PAYLOAD_PATH" "$PAYLOAD_PATH.sig" "$PAYLOAD_PATH.sha256" build/latest.json \
              --clobber \
              -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ZIP_PATH" "$PAYLOAD_PATH" "$PAYLOAD_PATH.sig" "$PAYLOAD_PATH.sha256" build/latest.json \
              --target "$GITHUB_SHA" \
              --title "SayIt $TAG" \
              --notes "SayIt ${VERSION}

          Updater feeds:
          - Tauri: https://sayit-update.vercel.app/latest.json
          - Sparkle: https://sayit-update.xiaobe.top/updates/stable/appcast.xml" \
              -R "$GITHUB_REPOSITORY"
          fi

      - name: Deploy latest.json to Vercel
        run: |
          set -euo pipefail
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing SayIt GitHub Actions secret: $key"
              exit 1
            fi
          done

          SITE_DIR="$RUNNER_TEMP/sayit-update-site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/public" "$SITE_DIR/.vercel"
          cp build/latest.json "$SITE_DIR/public/latest.json"

          python3 - "$SITE_DIR" "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" <<'PY'
          import json
          import pathlib
          import sys

          site = pathlib.Path(sys.argv[1])
          project_id = sys.argv[2]
          org_id = sys.argv[3]

          (site / "public" / "index.html").write_text(
              """<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>SayIt Update Feed</title>
            <meta name="robots" content="noindex" />
          </head>
          <body>
            <h1>SayIt Update Feed</h1>
            <p>Updater metadata: <a href="/latest.json">/latest.json</a></p>
          </body>
          </html>
          """,
              encoding="utf-8",
          )

          vercel_config = {
              "headers": [
                  {
                      "source": "/(.*)",
                      "headers": [
                          {"key": "Access-Control-Allow-Origin", "value": "*"},
                          {"key": "Access-Control-Allow-Methods", "value": "GET, HEAD, OPTIONS"},
                          {
                              "key": "Cache-Control",
                              "value": "public, max-age=60, s-maxage=60, must-revalidate",
                          },
                      ],
                  },
                  {
                      "source": "/latest.json",
                      "headers": [
                          {"key": "Content-Type", "value": "application/json; charset=utf-8"},
                          {
                              "key": "Cache-Control",
                              "value": "public, max-age=60, s-maxage=60, must-revalidate",
                          },
                      ],
                  },
              ]
          }
          (site / "vercel.json").write_text(
              json.dumps(vercel_config, indent=2) + "\n",
              encoding="utf-8",
          )
          (site / ".vercel" / "project.json").write_text(
              json.dumps({"projectId": project_id, "orgId": org_id}) + "\n",
              encoding="utf-8",
          )

          expected = json.loads((site / "public" / "latest.json").read_text(encoding="utf-8"))
          platforms = expected.get("platforms") or {}
          if not expected.get("version"):
              raise SystemExit("latest.json missing version")
          if "darwin-aarch64" not in platforms:
              raise SystemExit(f"latest.json missing darwin-aarch64: {platforms}")
          if not platforms["darwin-aarch64"].get("url") or not platforms["darwin-aarch64"].get("signature"):
              raise SystemExit("latest.json missing url/signature")
          print("local latest.json validated for version", expected["version"])
          PY

          cd "$SITE_DIR"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "Deployed updater feed: https://sayit-update.vercel.app/latest.json"
          sleep 3
          curl -fsSL "https://sayit-update.vercel.app/latest.json" | tee "$RUNNER_TEMP/deployed-latest.json"
          python3 - "$SITE_DIR/public/latest.json" "$RUNNER_TEMP/deployed-latest.json" <<'PY'
          import json
          import sys

          expected = json.load(open(sys.argv[1], encoding="utf-8"))
          deployed = json.load(open(sys.argv[2], encoding="utf-8"))
          if deployed.get("version") != expected.get("version"):
              raise SystemExit(
                  f"deployed version mismatch: {deployed.get('version')} != {expected.get('version')}"
              )
          print("latest.json live for version", expected["version"])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish Sparkle appcast to EdgeOne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "::warning::EDGEONE_API_TOKEN missing; skipping EdgeOne Sparkle appcast deploy."
            exit 0
          fi

          SIG_ENV_FILE="build/sparkle-signature.env"
          if [ -f "$SIG_ENV_FILE" ]; then
            set -a
            # shellcheck disable=SC1090
            . "$SIG_ENV_FILE"
            set +a
          fi

          CHANNEL="stable"
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL="beta"
          fi

          ZIP_PATH="build/SayIt-${VERSION}-macOS.zip"
          if [ -z "${SPARKLE_ED_LENGTH:-}" ] && [ -f "$ZIP_PATH" ]; then
            SPARKLE_ED_LENGTH="$(wc -c <"$ZIP_PATH" | tr -d ' ')"
          fi

          PUBLISHED_AT="$(
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt // empty' 2>/dev/null || true
          )"
          if [ -z "$PUBLISHED_AT" ]; then
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          RELEASE_URL="$(
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq '.url // empty' 2>/dev/null || true
          )"
          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          export VERSION TAG CHANNEL RELEASE_BUILD_NUMBER
          export SPARKLE_ED_SIGNATURE="${SPARKLE_ED_SIGNATURE:-}"
          export SPARKLE_ED_LENGTH="${SPARKLE_ED_LENGTH:-0}"
          export ZIP_PATH
          export PUBLISHED_AT RELEASE_URL
          export EDGEONE_API_TOKEN EDGEONE_PROJECT_NAME
          export EDGEONE_ENV=production
          export EDGEONE_PUBLIC_FEED_BASE="${EDGEONE_PUBLIC_FEED_BASE:-https://sayit-update.xiaobe.top}"
          # makers-2gtkiwcbcdiw is GitHub-connected; commit manifests then trigger GitHub redeploy.
          export EDGEONE_DEPLOY_MODE=github
          export EDGEONE_PROJECT_ID=makers-2gtkiwcbcdiw
          export RELEASE_NOTES_HTML="<p>SayIt ${VERSION}</p>"

          bash .github/scripts/publish_sparkle_edgeone.sh
