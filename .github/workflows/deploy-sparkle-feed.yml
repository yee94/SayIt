name: Deploy Sparkle Feed (EdgeOne)

# Rebuild + redeploy the static Sparkle appcast for the GitHub-connected
# EdgeOne project makers-2gtkiwcbcdiw (custom domain: sayit-update.xiaobe.top).
# Feed source branch is always main.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Repo branch EdgeOne should build (must be main for production feed)"
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - "deploy/sparkle-update-service/**"
      - ".github/workflows/deploy-sparkle-feed.yml"
      - ".github/scripts/publish_sparkle_edgeone.sh"

concurrency:
  group: sparkle-feed-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build And Redeploy EdgeOne Appcast
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: sayit-sparkle-update
      EDGEONE_PROJECT_ID: makers-2gtkiwcbcdiw
      EDGEONE_PUBLIC_FEED_BASE: https://sayit-update.xiaobe.top
      EDGEONE_API_BASE: https://pages-api.edgeone.ai/v1
      # Production Sparkle feed is always built from main.
      EDGEONE_REPO_BRANCH: main
    steps:
      - uses: actions/checkout@v5

      - name: Gate on EdgeOne token
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::EDGEONE_API_TOKEN is not configured; skipping EdgeOne deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Build static appcast site
        if: steps.gate.outputs.skip != 'true'
        working-directory: deploy/sparkle-update-service
        run: |
          set -euo pipefail
          node scripts/build.mjs
          test -f dist/updates/stable/appcast.xml
          test -f dist/updates/beta/appcast.xml
          test -f dist/health.json
          head -n 20 dist/updates/stable/appcast.xml

      - name: Trigger EdgeOne GitHub redeploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BRANCH="${EDGEONE_REPO_BRANCH}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_BRANCH="${{ github.event.inputs.branch }}"
            if [ -n "$INPUT_BRANCH" ] && [ "$INPUT_BRANCH" != "main" ]; then
              echo "::error::Production Sparkle feed must deploy from main (got: ${INPUT_BRANCH})"
              exit 1
            fi
          fi
          RESP="$(
            python3 - <<PY
          import json, urllib.request
          body = {
            "Action": "CreatePagesDeployment",
            "Region": "ap-singapore",
            "ProjectId": "${EDGEONE_PROJECT_ID}",
            "ViaMeta": "Github",
            "Provider": "Github",
            "Env": "Production",
            "RepoBranch": "${BRANCH}",
          }
          req = urllib.request.Request(
              "${EDGEONE_API_BASE}",
              data=json.dumps(body).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer ${EDGEONE_API_TOKEN}",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              print(resp.read().decode())
          PY
          )"
          echo "$RESP"
          DEPLOY_ID="$(printf '%s' "$RESP" | jq -r '.Data.Response.DeploymentId // empty')"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Failed to create EdgeOne deployment"
            exit 1
          fi
          echo "Triggered EdgeOne deployment=$DEPLOY_ID project=${EDGEONE_PROJECT_ID} branch=${BRANCH}"
          echo "Public feed:"
          echo "  ${EDGEONE_PUBLIC_FEED_BASE}/updates/stable/appcast.xml"
          echo "  ${EDGEONE_PUBLIC_FEED_BASE}/updates/beta/appcast.xml"
